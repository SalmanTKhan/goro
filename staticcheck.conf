# Video recording only has an encoder backend on Windows. The non-Windows
# builds of capture/ (encoder_factory_other.go) provide stubs that always
# return an error, so SA4023 ("comparison is always true") fires on every
# caller that error-checks NewEncoder / startRecording on Linux and macOS.
# The stub pattern is intentional, so SA4023 is disabled project-wide.
checks = ["inherit", "-SA4023"]
